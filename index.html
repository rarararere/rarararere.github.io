<script>

let errcode; document.addEventListener("DOMContentLoaded", () => {
    setInterval((()=> {
        let timemgr=new Date; let year=timemgr.getFullYear(); let mon=timemgr.getMonth()+1;
        let xingqi=timemgr.getDay(); let hour=timemgr.getHours(); let min=timemgr.getMinutes();
        let sec=timemgr.getSeconds(); let date=timemgr.getDate();
        let decentformatofhour = (hour<10) ? "0"+hour : hour;
        let decentformatofmin = (min<10) ? "0"+min : min;
        let decentformatofsec = (sec<10) ? "0"+sec : sec;
        let enday = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][xingqi];
        if(document.getElementById("year")) document.getElementById("year").innerHTML=year;
        if(document.getElementById("month")) document.getElementById("month").innerHTML=mon;
        if(document.getElementById("date")) document.getElementById("date").innerHTML=date;
        if(document.getElementById("hour")) document.getElementById("hour").innerHTML=decentformatofhour;
        if(document.getElementById("min")) document.getElementById("min").innerHTML=decentformatofmin;
        if(document.getElementById("sec")) document.getElementById("sec").innerHTML=decentformatofsec;
        if(document.getElementById("day")) document.getElementById("day").innerHTML=enday;
        if(document.getElementById("ampm")) document.getElementById("ampm").innerHTML = (hour>=12) ? "PM" : "AM";
        if(document.getElementById("hour2")) { let h12 = hour % 12; document.getElementById("hour2").innerHTML = (h12==0) ? 12 : h12; }
    }),100);
});
</script>
