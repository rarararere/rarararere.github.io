<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 れすぽんす ページが見つかりません - ららられれのお部屋</title>
    <style>
       
        :root {
            --text-color: #333333;
            --bg-color: #f9f9f9;
            --primary-color: #f38020;
            --primary-hover: #d96f14;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 20px;
        }

        
        .notfound-image {
            width: 100%;
            max-width: 300px; 
            height: auto;
            aspect-ratio: 1 / 1; 
            object-fit: contain;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 12px 0;
            font-weight: 700;
        }

        p {
            font-size: 1rem;
            color: #666;
            margin: 0 0 32px 0;
            line-height: 1.6;
        }

        
        .btn-home {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-home:hover {
            background-color: var(--primary-hover);
        }

        .btn-home:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="https://rarararere.pages.dev/notfoundplaceholder.png" alt="404 Not Found" class="notfound-image">
        
        <h2 id="tr3001">さーばーくんによれば、どうやらぺーじがないみたい、、。</h2>
        <p id="tr3002">そのページは、削除しちゃったとか、あどれすを変えちゃったとか、そもそもさいしょっからないとかの理由でみれないのかも。ふべんをかけちゃってごめんね..。</p>
        
        
        <a href="https://rarararere.github.io/" class="btn-home" id="tr3003">トップページへ</a>
<br>
<p id="tr3004">ららられれ(@Rarararere1)より。</p>
<p id="tr3005">なにかあるはずのものがない！とかじゅうだいなときは連絡してもらえるとたすかります！</p>
    </div>
<script>
    function jptoeng() {
        document.getElementById("tr3001").textContent = "According to the server, it seems that the page does not exist....(sorry)";
        document.getElementById("tr3002").textContent = "The page may not be viewable due to reasons such as being deleted, having its address changed, or simply never existing in the first place. I apologize for any inconvenience.";
        document.getElementById("tr3003").textContent = "Go to the top page of The Site of Rarararere!";
        document.getElementById("tr3004").textContent = "From Rarararere (@Rarararere1).";
        document.getElementById("tr3005").textContent = "If something important is missing or if you encounter any issues, please contact me!";
    }
    if (!navigator.language.startsWith('ja')) {
        jptoeng();
    }
</script>
</body>
</html>
